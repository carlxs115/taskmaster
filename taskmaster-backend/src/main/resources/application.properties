# =============================================================================
# TASKMASTER — CONFIGURACIÓN DE LA APLICACIÓN
# =============================================================================

# ----- SERVIDOR -----
# Puerto en el que escucha el backend Spring Boot (127.0.0.1:8080)
server.port=8080
# Solo escucha en loopback: la API usa HTTP Basic sin TLS y no debe ser
# accesible desde la red local
server.address=127.0.0.1
spring.application.name=taskmaster

# ----- BASE DE DATOS (SQLite) -----
# La base de datos se almacena en el directorio personal del usuario,
# en una carpeta oculta .taskmaster para no ensuciar el escritorio.
# Ejemplo en Windows: C:\Users\Carlos\.taskmaster\taskmaster.db
# Ejemplo en Linux: /home/carlos/.taskmaster/taskmaster.db
spring.datasource.url=jdbc:sqlite:${user.home}/.taskmaster/taskmaster.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# ----- JPA / HIBERNATE -----
# 'update' solo añade tablas y columnas; nunca renombra ni borra: eso va siempre en una
# migración de Flyway (ROB-3). Se mantiene como red de seguridad mientras V1 sea la única
# migración: completa una BD de la v1.0.0 marcada como V1 (task_dependencies y estimated_duration)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Formatea el SQL en múltiples líneas para mayor legibilidad en los logs
spring.jpa.properties.hibernate.format_sql=true

# Dialecto específico para SQLite (proporcionado por hibernate-community-dialects)
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Activa las foreign keys en SQLite (desactivadas por defecto en SQLite)
# Sin esto, las relaciones entre tablas no se validan a nivel de BD
spring.jpa.properties.hibernate.connection.foreign_keys=true

# Desactiva el patrón Open Session in View para evitar queries lazy
# inesperadas fuera de la capa de servicio
spring.jpa.open-in-view=false

# Desactiva el DDL que Hibernate deriva de Bean Validation (@NotNull, @Size...).
# No afecta al CHECK (col in (...)) que el dialecto de SQLite pone a cada columna
# de enum: ese lo pone al día EnumCheckMigration al arrancar (BUG-8)
spring.jpa.properties.hibernate.validator.apply_to_ddl=false

# ----- MIGRACIONES (Flyway) -----
# Flyway corre antes que Hibernate. Una BD nueva se crea con db/migration/V1__esquema_base.sql.
# Una BD sin flyway_schema_history (v1.0.0 a v1.1.1, o una copia restaurada de esas versiones)
# se marca como V1 sin ejecutar nada (baseline); lo que le falte lo añade después ddl-auto=update
# y el CHECK de los enums lo amplía EnumCheckMigration. Las migraciones publicadas no se
# modifican nunca: cada cambio de esquema es un V<n> nuevo
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Esquema anterior a Flyway (v1.0.0-v1.1.1)
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true

# ----- LOGS -----
logging.level.com.taskmaster=INFO
logging.level.org.springframework.security=INFO

# ----- ALMACENAMIENTO DE AVATARES -----
# Directorio donde se guardan las fotos de perfil de los usuarios.
# Se crea automáticamente al arrancar si no existe (AvatarStorageService.init())
taskmaster.storage.avatars-dir=${user.home}/.taskmaster/avatars

# ----- MULTIPART (subida de ficheros) -----
# Tamaño máximo del fichero de avatar permitido (coincide con la validación
# en AvatarService.MAX_SIZE_BYTES = 2 * 1024 * 1024)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB